    <path class="tf"  d="M8.72 4.23v7.575l6.561 3.787V8.018z"/>
    <path class="tf"  d="M8.72 12.635v7.575L15.28 24v-7.578z"/>
    <path class="tfd" d="M22.56 4.227l-6.561 3.791v7.574l6.56-3.787z"/>
  </g>

  <line class="r" x1="210" y1="36" x2="210" y2="164"/>

  <text class="h" x="240" y="94">Terraform Cheatsheet</text>
  <text class="s" x="242" y="132">Mastering Infrastructure as Code</text>
  <text class="n" x="242" y="162">init · plan · apply · state · workspaces · variables · modules · S3 backend · CI/CD</text>
