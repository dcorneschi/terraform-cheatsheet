<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Terraform Cheatsheet</title>
  <desc id="d">The Terraform logo, four purple parallelograms, next to the title Terraform Cheatsheet and the subtitle Mastering Infrastructure as Code.</desc>
  <defs>
    <style>
      .tf  { fill: #7b42bc; }
      .tfd { fill: #4f2b8f; }
      .h   { font-size: 56px; font-weight: 700; fill: #212529; letter-spacing: -0.5px; }
      .s   { font-size: 24px; fill: #495057; }
      .n   { font-size: 15px; fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      @media (prefers-color-scheme: dark) {
        .tf  { fill: #a067da; }
        .tfd { fill: #7b42bc; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
